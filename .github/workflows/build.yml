name: Build XZ1C TWRP Mixed SD LAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 cpio gzip file unzip

      - name: Verify golden base image
        run: |
          echo "260e8a41cd1e58d19b199bb0bf04aeef6ad63739dc31c8170f5bd474c0191a1a  base/twrp-3.7.1_12-0-20250728-lilac.img" | sha256sum -c -

      - name: Download official Magisk APK
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "XZ1C-TWRP-MixedSD-LAB"
              }
          )

          with urllib.request.urlopen(req) as r:
              release = json.load(r)

          print("Release:", release["tag_name"])

          assets = release.get("assets", [])

          for a in assets:
              print("Asset:", a["name"])

          apk = next(
              (a for a in assets if a["name"].lower().endswith(".apk")),
              None
          )

          if apk is None:
              raise SystemExit("No APK asset found in latest Magisk release")

          print("Selected APK:", apk["name"])
          print("Download:", apk["browser_download_url"])

          with urllib.request.urlopen(
              urllib.request.Request(
                  apk["browser_download_url"],
                  headers={
                      "User-Agent": "XZ1C-TWRP-MixedSD-LAB"
                  }
              )
          ) as r, open("Magisk.apk", "wb") as f:
              f.write(r.read())
          PY

          test -s Magisk.apk

          echo "===== APK CONTENT ====="
          unzip -l Magisk.apk | grep -E 'magiskboot|lib/.*/.*magiskboot' || true

          echo "===== APK SIZE ====="
          stat -c '%s bytes' Magisk.apk

      - name: Inspect golden image
        run: |
          file base/twrp-3.7.1_12-0-20250728-lilac.img

          python3 - <<'PY'
          import struct

          p = 'base/twrp-3.7.1_12-0-20250728-lilac.img'

          with open(p, 'rb') as f:
              d = f.read(4096)

          assert d[:8] == b'ANDROID!'

          vals = struct.unpack_from('<9I', d, 8)

          print('ANDROID boot header detected')
          print('header fields:', vals)
          PY

      - name: Patch and repack
        run: |
          rm -rf out work
          mkdir -p out

          ./scripts/patch_image.sh \
            "$PWD/magiskboot" \
            "$PWD/base/twrp-3.7.1_12-0-20250728-lilac.img" \
            "$PWD/out" \
            "$PWD"

      - name: Verify output exists and differs from base
        run: |
          test -s out/XZ1C-TWRP-MixedSD-v1-LAB.img

          echo "Output SHA-256:"
          sha256sum out/XZ1C-TWRP-MixedSD-v1-LAB.img

          BASE_SHA="260e8a41cd1e58d19b199bb0bf04aeef6ad63739dc31c8170f5bd474c0191a1a"
          OUT_SHA="$(sha256sum out/XZ1C-TWRP-MixedSD-v1-LAB.img | cut -d' ' -f1)"

          test "$OUT_SHA" != "$BASE_SHA"

          echo "$OUT_SHA  out/XZ1C-TWRP-MixedSD-v1-LAB.img" \
            > out/XZ1C-TWRP-MixedSD-v1-LAB.img.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xz1c-twrp-mixedsd-v1-lab
          name: XZ1C TWRP Mixed SD v1 LAB
          generate_release_notes: false
          files: |
            out/XZ1C-TWRP-MixedSD-v1-LAB.img
            out/XZ1C-TWRP-MixedSD-v1-LAB.img.sha256
