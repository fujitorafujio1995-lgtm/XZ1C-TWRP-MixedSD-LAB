name: XZ1C TWRP MixedSD v2.3 LAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x scripts/*.sh patches/*.py
          sudo apt-get update
          sudo apt-get install -y cpio gzip python3
          scripts/patch_image.sh base/twrp-3.7.1_12-0-20250728-lilac.img XZ1C-TWRP-MixedSD-v2.3-LAB.img
      - uses: actions/upload-artifact@v4
        with:
          name: XZ1C-TWRP-MixedSD-v2.3-LAB
          path: XZ1C-TWRP-MixedSD-v2.3-LAB.img
